#
# OpenBao backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
#
# state/environment is always included.
#

# Raft integrated storage (encrypted by the OpenBao barrier)
volumes/openbao-data

# Consistent storage copy, taken by module-dump-state with automatic unseal
state/openbao-data.tar

# Static auto-unseal key. Without it the storage of an instance using
# automatic unseal cannot be decrypted. The Restic repository is encrypted.
state/openbao-seal.key

# Break-glass administrator token, created by self-initialization (it
# exists in the OpenBao storage too, and expires 32 days after it).
state/openbao-breakglass.token

# Consistent Raft snapshot, taken by module-dump-state with the module token
state/openbao.snap

# Module token (narrow ns8-module policy) and Transit seal token
state/openbao-module.token
state/openbao-transit.token
